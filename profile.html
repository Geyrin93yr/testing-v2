<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>โปรไฟล์ของฉัน — รังติว</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-page">
  <div class="app-shell">
    <div class="app-topbar">
      <a class="icon-btn" href="main.html">←</a>
      <div class="profile-chip" onclick="toggleDropdown()">
        <div class="avatar">G</div>
        <span class="caret">▾</span>
      </div>
    </div>

    <div class="app-body">
      <div class="section-label">โปรไฟล์ของฉัน</div>

      <div class="panel-card" style="text-align:center;">
        <div class="avatar-wrap" id="avatarWrap">
          <div class="avatar" id="avatarLetter" style="width:100%;height:100%;font-size:28px;">G</div>
          <img id="avatarImg" class="avatar-img" style="display:none;">
          <div class="avatar-edit-btn" onclick="document.getElementById('photoInput').click()" title="เปลี่ยนรูปโปรไฟล์">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          </div>
        </div>
        <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="handlePhotoChange(event)">

        <div class="profile-name-row">
          <h3 id="nameDisplay">เกย์ริน</h3>
          <input type="text" id="nameInput" class="name-edit-input" style="display:none;" value="เกย์ริน">
          <div class="icon-btn-sm" id="editNameBtn" onclick="toggleEditName()" title="แก้ไขชื่อ">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>
          </div>
        </div>
        <p style="margin-top:2px;">นักศึกษา · วิทยาการคอมพิวเตอร์</p>
      </div>

      <div class="panel-list" style="margin-top:14px;">
        <div class="panel-card">
          <h3>คะแนนสะสม</h3>
          <div class="points-value">320 <span style="font-size:13px;color:var(--ink-soft);font-weight:500;">คะแนน</span></div>
        </div>

        <div class="panel-card">
          <h3>อีเมลที่ใช้เข้าระบบ</h3>
          <div class="field" style="margin-top:8px;">
            <input type="email" id="profileEmail" readonly>
          </div>
        </div>
        <!--
        <div class="panel-card">
          <h3>คาบติวทั้งหมด</h3>
          <p>เข้าร่วมแล้ว 12 คาบ ในภาคเรียนนี้</p>
        </div>-->
      </div>
    </div>

    <div class="dropdown" id="profileDropdown">
      <a class="dropdown-item" href="profile.html" style="display:block;color:inherit;">โปรไฟล์ของฉัน</a>
      <a class="dropdown-item" href="settings.html" style="display:block;color:inherit;">ตั้งค่า</a>
      <div class="dropdown-item danger" onclick="logout()">ออกจากระบบ</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
