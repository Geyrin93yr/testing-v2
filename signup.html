<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สมัครสมาชิก — รังติว</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-page">
  <div class="stage">
    <div class="tabs">
      <div class="tab active">เข้าสู่ระบบ</div>
    </div>
    <div class="card">
      <div class="back-row">
        <a class="icon-btn" href="index.html">←</a>
      </div>
      <span class="eyebrow">เข้าร่วมกับเรา</span>
      <h1 class="headline">สมัครสมาชิก</h1>
      <p class="sub">สร้างบัญชีเพื่อเริ่มจองคาบติวแรกของคุณ</p>

      <form id="signupForm">
        <div class="field">
          <label for="name">ชื่อ-นามสกุล</label>
          <input id="name" type="text" placeholder="ชื่อของคุณ" required>
        </div>
        <div class="field">
          <label for="email">อีเมล</label>
          <input id="email" type="email" placeholder="you@email.com" required>
        </div>
        <div class="field">
          <label for="pass">รหัสผ่าน</label>
          <input id="pass" type="password" placeholder="••••••••" required>
        </div>
        <div class="field">
          <label for="pass2">ยืนยันรหัสผ่าน</label>
          <input id="pass2" type="password" placeholder="••••••••" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit">สมัครสมาชิก</button>
      </form>

      <p class="foot-note">มีบัญชีอยู่แล้ว? <a class="link" href="index.html">เข้าสู่ระบบ</a></p>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
